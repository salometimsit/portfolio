<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salome Timsit</title>
  
  <!-- Modern Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

  <style>
    :root {
      --bg: #FFFFFF;
      --bg-alt: #F8FAFC;
      --bg-gradient: linear-gradient(135deg, #EEF2FF 0%, #F0FDFA 50%, #FAF5FF 100%);
      
      --text-dark: #0F172A;
      --text: #334155;
      --text-muted: #64748B;
      
      /* Vibrant Accents */
      --primary: #4F46E5;        /* Electric Indigo */
      --secondary: #06B6D4;      /* Vivid Cyan */
      --accent: #8B5CF6;         /* Bright Purple */
      --pink: #EC4899;           /* Pop Pink */
      --gradient-accent: linear-gradient(135deg, #4F46E5, #06B6D4);
      --gradient-warm: linear-gradient(135deg, #8B5CF6, #EC4899);
      
      --border: #E2E8F0;
      --border-glow: rgba(79, 70, 229, 0.2);
      
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 12px 28px -6px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 22px 45px -10px rgba(79, 70, 229, 0.12);
      
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.65;
      overflow-x: hidden;
      width: 100%;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
      width: 100%;
    }

    /* Navbar */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }
    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 72px;
      position: relative;
    }
    .logo {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 1.35rem;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 0.92rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--primary); }

    /* Mobile Hamburger Menu Toggle */
    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--text-dark);
      cursor: pointer;
      padding: 0.5rem;
    }

    /* Hero Section */
    .hero {
      padding: 9.5rem 0 6rem;
      background: var(--bg-gradient);
      position: relative;
      border-bottom: 1px solid var(--border);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 1.1rem;
      background: white;
      border: 1px solid #C7D2FE;
      box-shadow: var(--shadow-sm);
      border-radius: 9999px;
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 1.75rem;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10B981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    .hero h1 {
      font-family: var(--font-heading);
      font-size: 3.75rem;
      font-weight: 900;
      color: var(--text-dark);
      line-height: 1.1;
      letter-spacing: -1.8px;
      margin-bottom: 1.5rem;
    }
    .hero-lead {
      font-size: 1.25rem;
      color: var(--text);
      max-width: 820px;
      margin-bottom: 2rem;
    }
    .lang-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 2.5rem;
    }
    .lang-chip {
      background: white;
      border: 1px solid var(--border);
      padding: 0.35rem 0.9rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      box-shadow: var(--shadow-sm);
    }
    .cta-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 1.9rem;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary {
      background: var(--gradient-accent);
      color: white;
      box-shadow: 0 4px 18px rgba(79, 70, 229, 0.35);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 24px rgba(79, 70, 229, 0.45);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: white;
      color: var(--text-dark);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    /* Section Global */
    section { padding: 6rem 0; }
    .section-header { margin-bottom: 3rem; }
    .section-tag {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
      display: inline-block;
    }
    .section-title {
      font-family: var(--font-heading);
      font-size: 2.35rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -1px;
    }

    /* About Section */
    .about-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 3.5rem;
      box-shadow: var(--shadow-md);
      display: grid;
      grid-template-columns: 1.15fr 1.85fr;
      gap: 3.5rem;
      align-items: center;
      position: relative;
    }
    .profile-frame {
      position: relative;
      margin: 0 auto;
      max-width: 330px;
      width: 100%;
    }
    .profile-glow {
      position: absolute;
      inset: -10px;
      background: var(--gradient-accent);
      border-radius: 28px;
      filter: blur(14px);
      opacity: 0.45;
      z-index: 0;
    }
    .profile-img {
      position: relative;
      width: 100%;
      height: 380px;
      object-fit: cover;
      object-position: top center;
      border-radius: 24px;
      border: 5px solid white;
      box-shadow: var(--shadow-md);
      z-index: 1;
      display: block;
    }
    .about-text p {
      font-size: 1.05rem;
      margin-bottom: 1.15rem;
      color: var(--text);
    }
    .about-highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1.75rem;
    }
    .highlight-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      text-align: center;
    }
    .highlight-card h4 {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 800;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }
    .highlight-card p {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0;
    }

    /* 3D Wireframe Tech Sphere Container */
    .sphere-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 3.5rem;
      position: relative;
      width: 100%;
      overflow: hidden;
    }
    #sphere-canvas {
      cursor: grab;
      max-width: 100%;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #sphere-canvas:active {
      cursor: grabbing;
    }

    /* Skills Grid */
    .skills-section {
      background: #FAFAFD;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 6rem 0;
    }
    .skills-grid-roy {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.75rem;
    }
    .roy-skill-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.25rem;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .roy-skill-card:hover {
      border-color: #C7D2FE;
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
    }
    .roy-card-header {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.5rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .roy-card-header i {
      font-size: 1.35rem;
      color: var(--primary);
    }
    .roy-card-header h3 {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      margin: 0;
    }
    .skill-subgroup-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin: 1rem 0 0.6rem;
    }
    .skill-subgroup-title:first-child {
      margin-top: 0;
    }
    .roy-icon-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.85rem;
    }
    .roy-skill-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      min-height: 48px;
      box-sizing: border-box;
      transition: all 0.15s ease-in-out;
    }
    .roy-skill-badge span {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .roy-skill-badge:hover {
      background: white;
      border-color: #CBD5E1;
      transform: translateY(-1px);
    }
    .roy-skill-badge i {
      font-size: 1.35rem;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    /* Projects Detailed Showcase */
    .project-showcase {
      display: flex;
      flex-direction: column;
      gap: 4.5rem;
    }
    .project-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
      border-color: #C7D2FE;
    }
    .project-header-bar {
      background: #FAFAFD;
      border-bottom: 1px solid var(--border);
      padding: 1.35rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .project-org {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-dark);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
    }
    .tag-highlight {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.95rem;
      border-radius: 8px;
    }
    .tag-blue { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .tag-purple { background: #FAF5FF; color: #6D28D9; border: 1px solid #E9D5FF; }
    .tag-teal { background: #F0FDFA; color: #0F766E; border: 1px solid #99F6E4; }

    .project-body {
      padding: 2.75rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr 1.05fr;
      gap: 3.5rem;
      align-items: start;
    }
    .project-body h3 {
      font-family: var(--font-heading);
      font-size: 1.85rem;
      color: var(--text-dark);
      margin-bottom: 1.15rem;
      line-height: 1.25;
    }
    .metrics-box {
      background: linear-gradient(135deg, #F8FAFC, #EEF2FF);
      border: 1px solid #E0E7FF;
      border-radius: 14px;
      padding: 1.25rem 1.35rem;
      margin: 1.5rem 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      text-align: center;
    }
    .metric-value {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--primary);
    }
    .metric-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tech-pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-top: 1.5rem;
    }
    .pill {
      background: white;
      border: 1px solid #C7D2FE;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
    }
    .project-media-col {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      justify-content: center;
      width: 100%;
    }
    .media-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      background: #F8FAFC;
      box-shadow: var(--shadow-sm);
    }
    .media-card img {
      width: 100%;
      height: auto;
      max-height: 380px;
      display: block;
      object-fit: contain;
      background: #F1F5F9;
    }
    .media-caption {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 0.75rem 1.1rem;
      background: white;
      border-top: 1px solid var(--border);
      font-weight: 500;
    }

    /* Mobile Phone Carousel */
    .carousel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 375px;
      margin: 0 auto;
    }
    .carousel-track-wrapper {
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: #F8FAFC;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
    }
    .carousel-slide {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .carousel-slide.active {
      display: flex;
      animation: fadeIn 0.25s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .phone-mockup {
      width: 100%;
      height: 500px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0F172A;
    }
    .phone-mockup img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 1.15rem;
      padding: 0 0.5rem;
    }
    .carousel-btn {
      background: white;
      border: 1px solid var(--border);
      color: var(--primary);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .carousel-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: scale(1.05);
    }
    .carousel-dots {
      display: flex;
      gap: 0.5rem;
    }
    .dot {
      width: 9px;
      height: 9px;
      background: #CBD5E1;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .dot.active {
      background: var(--primary);
      width: 22px;
      border-radius: 9999px;
    }

    /* Wide Landscape Carousel */
    .wide-carousel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin: 0 auto;
    }
    .wide-carousel-wrapper {
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
    }
    .traffic-slide {
      display: none;
      flex-direction: column;
      width
